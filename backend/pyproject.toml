[project]
name = "agent-godot"
version = "0.1.0"
description = "Godot 游戏 Agent —— 从模型网关到四模式工作台"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "jieba>=0.42",
    "neo4j>=5.20",
    "pydantic>=2.7",
    "pymilvus>=3.0.1",
    "pypdf>=4.0",
    "pyyaml>=6.0",
    "trafilatura>=1.8",
]

[project.scripts]
godot-agent = "agent_godot.cli:main"

[dependency-groups]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "rank-bm25>=0.2.2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent_godot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
