[project]
name = "agent-godot"
version = "0.1.0"
description = "Godot 游戏 Agent —— 从模型网关到四模式工作台"
requires-python = ">=3.12"
dependencies = ["httpx>=0.27", "pyyaml>=6.0"]

[project.scripts]
godot-agent = "agent_godot.cli:main"

[dependency-groups]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent_godot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
